name: Publicar função

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-sincronizar-calendario
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar sincronizar-calendario
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código da main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Instalar Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/predict-league-cli" \
            --no-audit --no-fund --no-package-lock supabase@2.78.1

      - name: Publicar a função
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error title=Segredo do Supabase em falta::Adiciona SUPABASE_ACCESS_TOKEN em Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

          deploy_log="$RUNNER_TEMP/predict-league-deploy.log"
          # A função verifica o JWT do utilizador ou o segredo do agendador.
          if "$RUNNER_TEMP/predict-league-cli/node_modules/.bin/supabase" functions deploy sincronizar-calendario \
            --project-ref lipnsydupzsjdgwhpmgl --no-verify-jwt --use-api 2>&1 | tee "$deploy_log"; then
            exit 0
          fi

          motivo=$(grep -m1 -oE 'Invalid access token format|unexpected deploy status [0-9]{3}' "$deploy_log" || true)
          case "${motivo##* }" in
            format|401)
              echo "::error title=Token do Supabase inválido::Atualiza SUPABASE_ACCESS_TOKEN com um Personal Access Token criado em supabase.com/dashboard/account/tokens."
              ;;
            403)
              echo "::error title=Supabase recusou a publicação (HTTP 403)::O Supabase recusou a operação com o token guardado no GitHub."
              ;;
            404)
              echo "::error title=Supabase devolveu HTTP 404::A API de publicação não encontrou o recurso para o projeto lipnsydupzsjdgwhpmgl com este token."
              ;;
            '')
              echo "::error title=Comando de publicação falhou::O Supabase CLI falhou sem indicar um código HTTP. O passo Publicar a função contém a mensagem do comando."
              ;;
            *)
              echo "::error title=Supabase recusou a publicação::Código HTTP ${motivo##* }."
              ;;
          esac
          exit 1
