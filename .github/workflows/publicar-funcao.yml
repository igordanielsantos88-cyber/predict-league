name: Publicar função

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-sincronizar-calendario
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar sincronizar-calendario
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código da main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/predict-league-cli" \
            --no-audit --no-fund --no-package-lock supabase@2.78.1

      - name: Publicar a função
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Configura SUPABASE_ACCESS_TOKEN nos Secrets do GitHub.}"
          # A função verifica o JWT do utilizador ou o segredo do agendador.
          "$RUNNER_TEMP/predict-league-cli/node_modules/.bin/supabase" functions deploy sincronizar-calendario \
            --project-ref lipnsydupzsjdgwhpmgl --no-verify-jwt --use-api
